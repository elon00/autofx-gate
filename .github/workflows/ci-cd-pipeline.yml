name: Offline Diagnostic Regression CI
on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record tool versions
        run: |
          rustc --version
          cargo --version
          python3 --version
      - name: Compile and run Rust unit tests without network dependencies
        run: |
          cargo test --offline
          cargo build --offline
      - name: Run real offline diagnostic and negative controls
        run: |
          python3 tests/reality_check_harness.py
          python3 tests/reality_battery.py
      - name: Check Python syntax
        run: python3 -m py_compile tests/reality_check_harness.py tests/reality_battery.py
